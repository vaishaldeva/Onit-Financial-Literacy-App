<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180D2B" />
      <stop offset="50%" stop-color="#281647" />
      <stop offset="100%" stop-color="#0D1F22" />
    </linearGradient>
    <radialGradient id="glow9" cx="55%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.26" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg9)" />
  <circle cx="420" cy="215" r="220" fill="url(#glow9)" />

  <!-- Descending Debt Blocks (Shrinking Step-by-Step) -->
  <g transform="translate(210, 145)">
    <!-- Tallest Block -->
    <rect x="0" y="30" width="52" height="165" rx="10" fill="url(#blockGrad)" stroke="#A78BFA" stroke-width="2.5" stroke-opacity="0.6" />
    <!-- Medium Block -->
    <rect x="74" y="75" width="52" height="120" rx="10" fill="url(#blockGrad)" stroke="#A78BFA" stroke-width="2.5" stroke-opacity="0.6" />
    <!-- Small Block -->
    <rect x="148" y="120" width="52" height="75" rx="10" fill="url(#blockGrad)" stroke="#A78BFA" stroke-width="2.5" stroke-opacity="0.6" />
    <!-- Tiny Cleared Block -->
    <rect x="222" y="162" width="52" height="33" rx="8" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="2.5" />
  </g>

  <!-- Soaring Breakthrough Emerald Trajectory & Paper Plane / Arrow -->
  <path d="M195 310 Q360 305, 535 135" fill="none" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M195 310 Q360 305, 535 135" fill="none" stroke="#A7F3D0" stroke-width="14" stroke-linecap="round" opacity="0.15" />

  <!-- Sleek Origami Paper Plane Soaring Free (Top Right) -->
  <g transform="translate(505, 95) rotate(-12)">
    <polygon points="85,15 0,42 34,56" fill="#6EE7B7" />
    <polygon points="85,15 34,56 44,78" fill="#059669" />
    <polygon points="85,15 44,78 65,64" fill="#34D399" />
  </g>

  <!-- Ambient Freedom Sparks -->
  <circle cx="595" cy="95" r="4" fill="#A7F3D0" opacity="0.8" />
  <circle cx="485" cy="135" r="3" fill="#34D399" opacity="0.6" />
  <circle cx="555" cy="185" r="3.5" fill="#6EE7B7" opacity="0.5" />
</svg>
