<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F1305" />
      <stop offset="55%" stop-color="#19162B" />
      <stop offset="100%" stop-color="#080C17" />
    </linearGradient>
    <radialGradient id="aura3" cx="50%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#080C17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg3)" />
  <rect width="800" height="480" fill="url(#aura3)" />

  <!-- Soft Orbit Rings & Sparkles -->
  <circle cx="400" cy="250" r="155" stroke="#FBBF24" stroke-opacity="0.14" stroke-width="1.5" />
  <circle cx="265" cy="165" r="5" fill="#FDE68A" fill-opacity="0.7" />
  <circle cx="545" cy="180" r="4" fill="#67E8F9" fill-opacity="0.7" />
  <circle cx="520" cy="335" r="6" fill="#34D399" fill-opacity="0.6" />

  <!-- Minimalist Graduation Cap & Rolled Diploma Graphic Art -->
  <g transform="translate(400, 235)">
    <!-- Shadow -->
    <ellipse cx="0" cy="125" rx="105" ry="18" fill="#000000" fill-opacity="0.35" />

    <!-- Cap Skull Base -->
    <path d="M-76 6 V54 C-76 82 76 82 76 54 V6" fill="#1E293B" stroke="#FBBF24" stroke-opacity="0.8" stroke-width="3" />

    <!-- Mortarboard Diamond Top -->
    <polygon points="0,-64 148,-6 0,52 -148,-6" fill="url(#capTop)" stroke="#FDE68A" stroke-width="3" stroke-linejoin="round" />

    <!-- Center Button & Hanging Gold Tassel -->
    <circle cx="0" cy="-6" r="10" fill="#FDE68A" />
    <path d="M0 -6 Q68 8 96 68" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="96" cy="70" r="7" fill="#F59E0B" stroke="#FEF3C7" stroke-width="2" />
    <path d="M96 76 L88 98 M96 76 L96 100 M96 76 L104 98" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" />

    <!-- Sleek Rolled Scholarship Scroll in Foreground -->
    <g transform="translate(0, 92) rotate(-5)">
      <rect x="-68" y="-16" width="136" height="32" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5" />
      <rect x="-14" y="-17" width="28" height="34" rx="4" fill="#10B981" stroke="#6EE7B7" stroke-width="1.5" />
    </g>
  </g>
</svg>
