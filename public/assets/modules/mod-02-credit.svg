<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041527" />
      <stop offset="55%" stop-color="#08253A" />
      <stop offset="100%" stop-color="#040B16" />
    </linearGradient>
    <radialGradient id="aura2" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#040B16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164E63" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#065F46" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="arcGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg2)" />
  <rect width="800" height="480" fill="url(#aura2)" />

  <!-- Glowing Score Meter Arc Behind Card -->
  <path d="M 210 310 A 195 195 0 0 1 590 310" stroke="url(#arcGlow)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.65" />
  <circle cx="568" cy="212" r="9" fill="#6EE7B7" />

  <!-- Sleek Minimalist Floating Credit Card -->
  <g transform="translate(400, 255) rotate(-8)">
    <!-- Drop Shadow -->
    <rect x="-150" y="-82" width="310" height="190" rx="24" fill="#000000" fill-opacity="0.4" />
    <!-- Card Body -->
    <rect x="-155" y="-95" width="310" height="190" rx="24" fill="url(#cardGrad)" stroke="#67E8F9" stroke-opacity="0.7" stroke-width="2.5" />
    <!-- Glossy Reflection -->
    <path d="M-131 -93 H131 A22 22 0 0 1 153 -71 V-10 Q0 25 -153 -30 V-71 A22 22 0 0 1 -131 -93 Z" fill="#FFFFFF" fill-opacity="0.07" />
    <!-- Gold EMV Chip -->
    <rect x="-118" y="-28" width="52" height="38" rx="8" fill="#FBBF24" stroke="#FEF08A" stroke-width="1.5" />
    <line x1="-118" y1="-9" x2="-66" y2="-9" stroke="#92400E" stroke-width="1.5" />
    <line x1="-92" y1="-28" x2="-92" y2="10" stroke="#92400E" stroke-width="1.5" />
    <!-- Contactless Waves -->
    <path d="M102 -18 A14 14 0 0 1 102 2" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M110 -24 A22 22 0 0 1 110 8" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M118 -30 A30 30 0 0 1 118 14" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Minimalist Geometric Card Bars -->
    <rect x="-118" y="42" width="110" height="10" rx="5" fill="#67E8F9" fill-opacity="0.45" />
    <rect x="-118" y="60" width="64" height="8" rx="4" fill="#94A3B8" fill-opacity="0.35" />
    <!-- Overlapping Network Circles -->
    <circle cx="92" cy="54" r="18" fill="#22D3EE" fill-opacity="0.85" />
    <circle cx="114" cy="54" r="18" fill="#34D399" fill-opacity="0.85" />
  </g>
</svg>
