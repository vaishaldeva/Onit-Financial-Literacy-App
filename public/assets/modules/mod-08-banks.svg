<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#090F24" />
    </linearGradient>
    <radialGradient id="glow8" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="goldVault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg8)" />
  <circle cx="400" cy="225" r="215" fill="url(#glow8)" />

  <!-- Outer Protective Halo Ring -->
  <circle cx="400" cy="225" r="155" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.35" />

  <!-- Minimalist Architectural Bank Facade -->
  <g transform="translate(270, 105)">
    <!-- Roof Pediment (Triangle) -->
    <polygon points="130,0 250,65 10,65" fill="url(#pillarGrad)" stroke="#93C5FD" stroke-width="3" stroke-linejoin="round" />
    <polygon points="130,18 215,55 45,55" fill="none" stroke="#BFDBFE" stroke-width="1.5" opacity="0.4" />

    <!-- Architrave Bar -->
    <rect x="20" y="65" width="220" height="14" rx="4" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2" />

    <!-- 4 Architectural Columns -->
    <rect x="38" y="79" width="24" height="125" rx="4" fill="url(#pillarGrad)" stroke="#60A5FA" stroke-width="2" />
    <rect x="91" y="79" width="24" height="125" rx="4" fill="url(#pillarGrad)" stroke="#60A5FA" stroke-width="2" />
    <rect x="145" y="79" width="24" height="125" rx="4" fill="url(#pillarGrad)" stroke="#60A5FA" stroke-width="2" />
    <rect x="198" y="79" width="24" height="125" rx="4" fill="url(#pillarGrad)" stroke="#60A5FA" stroke-width="2" />

    <!-- Base Steps -->
    <rect x="20" y="204" width="220" height="14" rx="4" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2" />
    <rect x="8" y="218" width="244" height="16" rx="5" fill="url(#pillarGrad)" stroke="#93C5FD" stroke-width="2.5" />

    <!-- Central Golden Vault Wheel Emblem -->
    <circle cx="130" cy="142" r="28" fill="#0B132B" stroke="url(#goldVault)" stroke-width="5" />
    <circle cx="130" cy="142" r="8" fill="url(#goldVault)" />
    <line x1="130" y1="118" x2="130" y2="166" stroke="url(#goldVault)" stroke-width="3" stroke-linecap="round" />
    <line x1="106" y1="142" x2="154" y2="142" stroke="url(#goldVault)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
