<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0B18" />
      <stop offset="50%" stop-color="#38122A" />
      <stop offset="100%" stop-color="#140710" />
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg6)" />
  <circle cx="400" cy="225" r="210" fill="url(#glow6)" />

  <!-- Minimalist Shopping Bag -->
  <g transform="translate(310, 125)">
    <!-- Bag Handles -->
    <path d="M55 45 C55 5, 125 5, 125 45" fill="none" stroke="#FDA4AF" stroke-width="6" stroke-linecap="round" />
    <path d="M70 45 C70 20, 110 20, 110 45" fill="none" stroke="#FB7185" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Bag Body -->
    <path d="M20 45 L160 45 L175 215 C176 226, 168 235, 157 235 L23 235 C12 235, 4 226, 5 215 Z" fill="url(#bagGrad)" stroke="#FB7185" stroke-width="3.5" stroke-opacity="0.6" />

    <!-- Subtle Geometric Fold Lines -->
    <line x1="40" y1="45" x2="32" y2="235" stroke="#FDA4AF" stroke-width="1.5" opacity="0.2" />
    <line x1="140" y1="45" x2="148" y2="235" stroke="#FDA4AF" stroke-width="1.5" opacity="0.2" />

    <!-- Handle Grommets -->
    <circle cx="55" cy="62" r="6" fill="#1E0B18" stroke="#FDA4AF" stroke-width="3" />
    <circle cx="125" cy="62" r="6" fill="#1E0B18" stroke="#FDA4AF" stroke-width="3" />

    <!-- Heart / Value Emblem in Center of Bag -->
    <path d="M90 155 C90 155, 62 135, 62 117 C62 105, 73 98, 83 104 C87 107, 90 112, 90 112 C90 112, 93 107, 97 104 C107 98, 118 105, 118 117 C118 135, 90 155, 90 155 Z" fill="#FB7185" fill-opacity="0.35" stroke="#FDA4AF" stroke-width="2.5" />
  </g>

  <!-- Floating Gold Price Tag (Right) -->
  <g transform="translate(495, 145) rotate(22)">
    <path d="M0 24 L24 0 L95 0 C101 0, 106 5, 106 11 L106 53 C106 59, 101 64, 95 64 L24 64 L0 40 Z" fill="url(#tagGrad)" opacity="0.92" />
    <circle cx="24" cy="32" r="6" fill="#1E0B18" />
    <line x1="45" y1="24" x2="84" y2="24" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="45" y1="40" x2="70" y2="40" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round" opacity="0.55" />
  </g>

  <!-- Floating Pause / Mindful Clock Badge (Left) -->
  <g transform="translate(215, 225)">
    <circle cx="45" cy="45" r="42" fill="#0F172A" fill-opacity="0.7" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.7" />
    <circle cx="45" cy="45" r="32" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5" />
    <path d="M45 25 L45 45 L58 54" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="45" cy="45" r="4" fill="#38BDF8" />
  </g>
</svg>
