<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A14" />
      <stop offset="50%" stop-color="#0B2E23" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <radialGradient id="glow10" cx="55%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="curveArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="curveStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg10)" />
  <circle cx="430" cy="210" r="220" fill="url(#glow10)" />

  <!-- Subtle Horizon Grid Lines -->
  <line x1="180" y1="330" x2="620" y2="330" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.25" />
  <line x1="180" y1="260" x2="620" y2="260" stroke="#34D399" stroke-width="1" stroke-dasharray="6 8" stroke-opacity="0.15" />
  <line x1="180" y1="190" x2="620" y2="190" stroke="#34D399" stroke-width="1" stroke-dasharray="6 8" stroke-opacity="0.15" />

  <!-- Smooth Exponential Compound Growth Area & Curve -->
  <path d="M190 325 C310 322, 430 285, 575 115 L575 330 L190 330 Z" fill="url(#curveArea)" />
  <path d="M190 325 C310 322, 430 285, 575 115" fill="none" stroke="url(#curveStroke)" stroke-width="6" stroke-linecap="round" />

  <!-- Glowing Milestone Nodes Along the Curve -->
  <circle cx="270" cy="316" r="6" fill="#061A14" stroke="#34D399" stroke-width="3.5" />
  <circle cx="385" cy="285" r="7" fill="#061A14" stroke="#34D399" stroke-width="4" />
  <circle cx="485" cy="218" r="8" fill="#061A14" stroke="#6EE7B7" stroke-width="4" />

  <!-- Radiant North Star at Peak of Compound Curve -->
  <g transform="translate(575, 115)">
    <circle cx="0" cy="0" r="28" fill="#F59E0B" opacity="0.22" />
    <path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z" fill="url(#starGold)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>
</svg>
