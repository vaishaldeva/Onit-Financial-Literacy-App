<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041B1D" />
      <stop offset="55%" stop-color="#072729" />
      <stop offset="100%" stop-color="#050E17" />
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050E17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="coinGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="emeraldGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg1)" />
  <rect width="800" height="480" fill="url(#aura1)" />

  <!-- Soft ambient decorative rings -->
  <circle cx="400" cy="255" r="165" stroke="#34D399" stroke-opacity="0.12" stroke-width="1.5" />
  <circle cx="400" cy="255" r="120" stroke="#22D3EE" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="6 8" />

  <!-- Minimalist 3-Segment Pie / Donut Ring representing balanced money -->
  <g transform="translate(400, 260)">
    <!-- Base shadow -->
    <ellipse cx="0" cy="115" rx="95" ry="18" fill="#000000" fill-opacity="0.35" />

    <!-- Glassmorphic Vault / Jar Body -->
    <rect x="-78" y="-45" width="156" height="140" rx="36" fill="url(#emeraldGlass)" stroke="#6EE7B7" stroke-opacity="0.65" stroke-width="2.5" />
    <rect x="-52" y="-66" width="104" height="22" rx="10" fill="#10B981" fill-opacity="0.3" stroke="#6EE7B7" stroke-opacity="0.7" stroke-width="2" />

    <!-- Glowing GrowthSprout inside Jar -->
    <path d="M0 65 V-5" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" />
    <path d="M0 28 C-34 28 -38 -2 -6 -2 C-2 -2 0 14 0 28 Z" fill="#34D399" />
    <path d="M0 12 C34 12 38 -18 6 -18 C2 -18 0 -2 0 12 Z" fill="#6EE7B7" />

    <!-- Floating Golden Coins -->
    <g transform="translate(-128, -42) rotate(-14)">
      <circle cx="0" cy="0" r="28" fill="url(#coinGold)" stroke="#FEF3C7" stroke-width="2" />
      <circle cx="0" cy="0" r="20" stroke="#92400E" stroke-opacity="0.4" stroke-width="1.5" />
      <path d="M0 -10 V10 M-6 -5 C-6 -9 6 -9 6 -4 C6 0 -6 0 -6 4 C-6 9 6 9 6 5" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <g transform="translate(128, -24) rotate(16)">
      <circle cx="0" cy="0" r="24" fill="url(#coinGold)" stroke="#FEF3C7" stroke-width="2" />
      <circle cx="0" cy="0" r="17" stroke="#92400E" stroke-opacity="0.4" stroke-width="1.5" />
      <path d="M0 -8 V8 M-5 -4 C-5 -7 5 -7 5 -3 C5 0 -5 0 -5 3 C-5 7 5 7 5 4" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <g transform="translate(0, -108)">
      <circle cx="0" cy="0" r="20" fill="url(#coinGold)" stroke="#FEF3C7" stroke-width="2" />
      <circle cx="0" cy="0" r="14" stroke="#92400E" stroke-opacity="0.4" stroke-width="1.5" />
    </g>
  </g>
</svg>
