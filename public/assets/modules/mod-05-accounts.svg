<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04192B" />
      <stop offset="55%" stop-color="#072438" />
      <stop offset="100%" stop-color="#050D1A" />
    </linearGradient>
    <radialGradient id="aura5" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#050D1A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pod1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="pod2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pod3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg5)" />
  <rect width="800" height="480" fill="url(#aura5)" />

  <!-- Platform Base -->
  <ellipse cx="400" cy="368" rx="220" ry="26" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" />

  <!-- Three Translucent Rising Account Pillars (Checking, HYSA, Retirement) -->
  <!-- Pillar 1: Checking -->
  <g transform="translate(245, 225)">
    <rect x="-46" y="0" width="92" height="130" rx="22" fill="url(#pod1)" stroke="#7DD3FC" stroke-width="2.5" />
    <circle cx="0" cy="-28" r="16" fill="#38BDF8" fill-opacity="0.25" stroke="#7DD3FC" stroke-width="2" />
  </g>

  <!-- Pillar 2: High-Yield Savings -->
  <g transform="translate(400, 175)">
    <rect x="-46" y="0" width="92" height="180" rx="22" fill="url(#pod2)" stroke="#6EE7B7" stroke-width="2.5" />
    <circle cx="0" cy="-28" r="18" fill="#10B981" fill-opacity="0.28" stroke="#6EE7B7" stroke-width="2" />
    <path d="M-7 -28 L0 -35 L7 -28 M0 -35 V-20" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Pillar 3: Retirement / Roth IRA -->
  <g transform="translate(555, 125)">
    <rect x="-46" y="0" width="92" height="230" rx="22" fill="url(#pod3)" stroke="#C4B5FD" stroke-width="2.5" />
    <circle cx="0" cy="-28" r="20" fill="#8B5CF6" fill-opacity="0.3" stroke="#C4B5FD" stroke-width="2" />
    <polygon points="0,-38 3,-31 10,-31 5,-26 7,-19 0,-23 -7,-19 -5,-26 -10,-31 -3,-31" fill="#DDD6FE" />
  </g>
</svg>
